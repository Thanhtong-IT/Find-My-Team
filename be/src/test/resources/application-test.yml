spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: testSecretKeyForTestingOnlyMustBeAtLeast256BitsLongPleaseChangeInProd
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

logging:
  level:
    root: WARN
    com.findmyteam: DEBUG
