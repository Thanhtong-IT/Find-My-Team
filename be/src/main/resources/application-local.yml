spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/findmyteam
    username: postgres
    password: postgres

  jpa:
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: devSecretKeyForLocalDevelopmentOnlyMustBeAtLeast256BitsLongPleaseChangeInProd
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

logging:
  level:
    com.findmyteam: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
