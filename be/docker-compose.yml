services:
  postgres:
    image: postgres:16-alpine
    container_name: find-my-team-postgres
    environment:
      POSTGRES_DB: findmyteam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d findmyteam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - find-my-team-network

  redis:
    image: redis:7-alpine
    container_name: find-my-team-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - find-my-team-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  find-my-team-network:
    driver: bridge
