name: find_my_team
description: "Ứng dụng kết nối người chơi game - Tìm teammate, tạo team, giao lưu cộng đồng"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Network
  dio: ^5.4.3+1

  # Environment Configuration
  flutter_dotenv: ^6.0.1

  # Local Storage
  flutter_secure_storage: ^10.3.1

  # WebSocket
  web_socket_channel: ^3.0.1

  # Dependency Injection
  get_it: ^9.2.1

  # JSON Serialization
  json_annotation: ^4.9.0

  # Utility
  uuid: ^4.5.1
  connectivity_plus: ^7.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
